[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-appraisal-assistant"
version = "0.1.0"
description = "Collaborative Hebrew real-estate appraisal web application"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "pypdf>=6.20.0,<7",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "google-genai>=1.0",
    "openai>=1.0",
    "anthropic>=1.4,<2",
    "keyring>=25.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "PyJWT[crypto]>=2.15.0,<3",
    "cryptography>=50.0.2,<51",
    "certifi>=2026.10.19",
    "urllib3>=2.8.0,<3",
    "supabase>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
appraisal-assistant = "appraisal_assistant.main:main"
appraisal-api = "api.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"appraisal_assistant.agents.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
